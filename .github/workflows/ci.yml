name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test release scripts
        run: ./Scripts/test-release-scripts.sh

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Verify iOS 26+ SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          # The Icon Composer app icon (SleepDaddy/AppIcon.icon) needs the
          # iOS 26 SDK or newer to compile. This is a build-SDK floor and is
          # independent of the deployment target.
          MAJOR="$(
            xcodebuild -showsdks \
              | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' \
              | sort -rn \
              | head -1
          )"
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 26 ]; then
            echo "Need the iOS 26 SDK or newer, found: ${MAJOR:-none}" >&2
            exit 1
          fi

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: ./generate.sh

      - name: Run tests
        run: |
          set -o pipefail
          DEVICE="$(
            xcrun simctl list devices available \
              | grep -oE 'iPhone [0-9]+( Pro( Max)?| Plus)?' \
              | head -1
          )"
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -scheme SleepDaddy \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
          | xcbeautify
        env:
          NSUnbufferedIO: YES

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
