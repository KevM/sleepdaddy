name: Release to TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & upload
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify iOS 26 SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -showsdks | grep -q 'iphoneos26'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate tagged release version
        if: startsWith(github.ref, 'refs/tags/')
        run: ./Scripts/validate-release-version.sh "${GITHUB_REF_NAME}" project.yml

      - name: Generate Xcode project
        run: ./generate.sh
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Upload IPA and dSYMs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: |
            *.ipa
            *.app.dSYM.zip
          retention-days: 14
          if-no-files-found: ignore
