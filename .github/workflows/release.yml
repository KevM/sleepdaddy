name: Release to TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & upload
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Verify iOS 26+ SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          # The Icon Composer app icon (SleepDaddy/AppIcon.icon) needs the
          # iOS 26 SDK or newer to compile. This is a build-SDK floor and is
          # independent of the deployment target.
          MAJOR="$(
            xcodebuild -showsdks \
              | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' \
              | sort -rn \
              | head -1
          )"
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 26 ]; then
            echo "Need the iOS 26 SDK or newer, found: ${MAJOR:-none}" >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate tagged release version
        if: startsWith(github.ref, 'refs/tags/')
        run: ./Scripts/validate-release-version.sh "${GITHUB_REF_NAME}" project.yml

      - name: Generate Xcode project
        run: ./generate.sh
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Upload IPA and dSYMs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-build
          path: |
            *.ipa
            *.app.dSYM.zip
          retention-days: 14
          if-no-files-found: ignore
